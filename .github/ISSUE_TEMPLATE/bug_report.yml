name: 'Bug report'
title: "[BUG] - YOUR_ISSUE_TITLE_HERE_REPLACE_ME"
description: Create a report to help us improve RadianOs
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue 🙏

        This issue tracker is for **reporting bugs in the [RadianOs GitHub repository](https://github.com/radian-os/radianos)**.

        If you're unsure whether it's a bug or need implementation help, consider posting your question here instead:
          - RadianOs [Discussions](https://github.com/radian-os/radianos/discussions)
          - Join our [Discord community](https://discord.gg/radianos)

        Before opening a new issue, please check:
         - [Open issues](https://github.com/radian-os/radianos/issues?q=is%3Aopen)
         - [Closed issues](https://github.com/radian-os/radianos/issues?q=is%3Aissue+is%3Aclosed)
         - [Discussions tab](https://github.com/radian-os/radianos/discussions)

        The more details you provide, the faster we can help!
  - type: input
    id: version
    attributes:
      label: RadianOs Version
      description: |
        Please provide the version of RadianOs you're using.
        You can find it in your `package.json` or by running `pnpm list radianos`.
      placeholder: ex. 1.2.3 or @radianos/button@1.0.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Provide a clear and concise description of the issue.
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Reproduction URL or GitHub Repo
      description: |
        Provide a public link to your minimal reproducible example.
        You can use StackBlitz, CodeSandbox, or a public GitHub repo.
        Please avoid localhost URLs.
      placeholder: e.g. https://stackblitz.com/edit/... or https://github.com/your-user/example-repo
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Describe the steps to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
      placeholder: As a user, I expected ___ behavior but saw ___ instead.
    validations:
      required: true
  - type: textarea
    id: screenshots_or_videos
    attributes:
      label: Screenshots or Videos
      description: If available, add screenshots or videos to help explain the issue.
      placeholder: You can drag your media files into this editor.
  - type: input
    id: os
    attributes:
      label: Operating System
      description: What OS are you using?
      placeholder: e.g. macOS 14, Windows 11, Ubuntu 22.04
    validations:
      required: true
  - type: dropdown
    id: browser_type
    attributes:
      label: Browser
      description: Which browsers are affected?
      options:
        - "Chrome"
        - "Firefox"
        - "Safari"
        - "Edge"
        - "Opera"
        - "Other (add details in the description)"
    validations:
      required: true
