name: "🐞 Bug Report"
title: "[BUG] - Briefly describe the issue"
description: "Report a reproducible bug in the RadianOs UI component system."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >
        Thanks for taking the time to report a bug in **RadianOs**.

        Please ensure the issue hasn’t already been reported or addressed in discussions.

        If you're unsure whether it's a bug, please start a discussion instead.

        A clear and detailed report with reproduction steps helps us resolve issues faster 🙏

  - type: input
    id: bug-title
    attributes:
      label: Title
      description: "A brief summary of the issue."
      placeholder: "e.g. OTPInput crashes on paste"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: "A clear and concise description of what the bug is and how it affects functionality. Mention if you intend to submit a PR for this."
      placeholder: "Describe the unexpected behavior and what you expected instead."
    validations:
      required: true

  - type: input
    id: affected-components
    attributes:
      label: Affected RadianOs components
      description: "List the components affected by this bug (e.g., Button, Input, OTPInput)"
      placeholder: "e.g. Button, Accordion, OTPInput"
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: "How can we reproduce the bug? Provide a step-by-step guide."
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Observe the issue
    validations:
      required: true

  - type: input
    id: reproduction-link
    attributes:
      label: Minimal reproduction
      description: "Link to a live example using StackBlitz, CodeSandbox, or GitHub. Required for most bug reports."
      placeholder: "https://stackblitz.com/edit/your-repo"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: "Paste any browser or server logs that may help identify the issue."
      placeholder: "Paste logs here instead of uploading screenshots."
    validations:
      required: false

  - type: textarea
    id: system-info
    attributes:
      label: System Info
      description: "Provide OS, browser, Node.js version, and package manager details."
      placeholder: |
        - OS: macOS Sonoma 14.5
        - Browser: Chrome 125
        - Node: 20.3.0
        - Package Manager: pnpm 8.6.5
    validations:
      required: true

  - type: checkboxes
    id: research-checklist
    attributes:
      label: Confirmation
      description: "Please confirm you've done the following before submitting:"
      options:
        - label: "I have searched existing issues and discussions."
          required: true
        - label: "I have reviewed the documentation."
          required: true
        - label: "I agree to follow the contributing guidelines."
          required: true
