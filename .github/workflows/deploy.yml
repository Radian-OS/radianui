name: Build and Deploy

on:
  push:
    branches:
      - main
      - dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Validate production build variables
        if: github.ref_name == 'main'
        env:
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_AHREFS_ANALYTICS_KEY: ${{ vars.NEXT_PUBLIC_AHREFS_ANALYTICS_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_POSTHOG_KEY" ]; then
            echo "::error::NEXT_PUBLIC_POSTHOG_KEY is not configured in the GitHub main environment"
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_AHREFS_ANALYTICS_KEY" ]; then
            echo "::error::NEXT_PUBLIC_AHREFS_ANALYTICS_KEY is not configured in the GitHub main environment"
            exit 1
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_DEPLOYMENT_ENV=${{ github.ref_name == 'main' && 'PROD' || 'DEV' }}
            NEXT_PUBLIC_WEBSITE_URL=${{ vars.NEXT_PUBLIC_WEBSITE_URL || 'https://radianui.com' }}
            NEXT_PUBLIC_BLOCKS_URL=${{ vars.NEXT_PUBLIC_BLOCKS_URL || 'https://blocks.radianui.com' }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_AHREFS_ANALYTICS_KEY=${{ vars.NEXT_PUBLIC_AHREFS_ANALYTICS_KEY }}

      - name: Trigger Coolify Deployment
        run: |
          if [ -n "${{ secrets.COOLIFY_WEBHOOK_URL }}" ]; then
            curl --request GET '${{ secrets.COOLIFY_WEBHOOK_URL }}' --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'
          else
            echo "::warning ::No COOLIFY_WEBHOOK_URL secret found for environment '${{ github.ref_name }}'"
          fi
